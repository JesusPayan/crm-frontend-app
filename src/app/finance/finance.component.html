<div class="relative  w-full max-w-3xl h-full md:h-auto">
    <div class="relative p-4 w-full max-w-2xl h-full md:h-auto bg-gray-800">
            <div class="flex justify-between items-center pb-4 mb-4 rounded-t border-b sm:mb-5 dark:border-gray-600">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-yellow-400">
                    Finanzas
                </h2>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="defaultModal" (click)="closeModal()">
                    <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                    <!-- <span class="sr-only">Close modal</span> -->
                </button>
            </div>
            <div class="grid gap-4 mb-4 sm:grid-cols-3">
                <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400 text-center">
                        <tr>
                             <th scope="col" class="p-4 text-center"  >Ingresos</th>
                             <th scope="col" class="p-4 text-center"  >Egresos</th>
                             <th scope="col" class="p-4 text-center"  >Balance</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-900 text-center" *ngFor="let balance of balances">
                            <td class="px-1 py-3 font-medium text-gray-900 whitespace-nowrap dark:text-white">{{balances[1].ingress}}</td>
                            <td class="px-1 py-3 font-medium text-gray-900 whitespace-nowrap dark:text-white">{{balance.egresse}}</td>
                            <td class="px-1 py-3 font-medium text-gray-900 whitespace-nowrap dark:text-white">{{balance.balance}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            </div>

        </div>
</div>
