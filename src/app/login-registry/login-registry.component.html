<section class="bg-gray-50 dark:bg-gray-900 auth-container">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
    <div class="w-full bg-red-600 rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        
        <h2 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
          {{ mode === 'login' ? 'Iniciar Sesión' : 'Registrarse' }}
        </h2>

        <!-- Reactive Form -->
        <form class="space-y-4 md:space-y-6" #userForm (ngSubmit)="onSubmit()" method="post">
          
          <!-- Email -->
          <div>
            <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Correo</label>
            <input name="email" type="email" id="email" placeholder="name@company.com"
              class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 
                     dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                     [(ngModel)]="user.email"
                     />

          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contraseña</label>
            <div class="relative">
              <input name="password" [type]="typePassword" id="password" placeholder="••••••••"
                class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg 
                       focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 
                       dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 
                       dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                       [(ngModel)]="user.password"/>
              <button type="button" (click)="togglePasswordVisibility()" 
                class="absolute inset-y-0 right-3 flex items-center text-sm text-gray-600 dark:text-gray-300">
                {{ typePassword === 'user.password' ? '👁️' : '🙈' }}
              </button>
            </div>
          </div>

          <!-- Confirm Password (solo registro) -->
          <!-- <div *ngIf="mode === 'register'">
            <label for="confirmPassword" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirmar Contraseña</label>
            <input formControlName="confirmPassword" type="password" id="confirmPassword" placeholder="••••••••"
              class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 
                     dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" />
          </div> -->

          <!-- Phone (solo registro) -->
          <div *ngIf="mode === 'register'">
            <label for="phone" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Teléfono</label>
            <input name="phone" type="tel" id="phone" placeholder="+52 123 456 789"
              class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 
                     dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                     [(ngModel)]="user.phone"/>
          </div>

          <!-- Remember me + Forgot password -->
          <div class="flex items-center justify-between">
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input id="remember" type="checkbox" class="border border-gray-300 rounded bg-gray-50 
                       focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 
                       dark:focus:ring-primary-600 dark:ring-offset-gray-800" />
              </div>
              <div class="ml-3 text-sm">
                <label for="remember" class="text-gray-500 dark:text-gray-300">Remember me</label>
              </div>
            </div>
            <a href="#" class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-500">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Submit -->
          <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 
                  focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg 
                  text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 
                  dark:focus:ring-blue-800">
            {{ mode !== 'login' ? 'Registrar' : 'Iniciar sesión' }}
          </button>
        </form>

        <!-- Switch mode -->
        <p class="text-sm font-light text-white dark:text-white">
          {{ mode === 'login' ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
          <button class="font-medium text-primary-600 hover:underline dark:text-blue-500"
            (click)="switchMode(mode === 'login' ? 'register' : 'login')">
            {{ mode === 'login' ? 'Regístrate aquí' : 'Inicia sesión aquí' }}
          </button>
        </p>

      </div>
    </div>
  </div>
</section>
